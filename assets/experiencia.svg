<svg xmlns="http://www.w3.org/2000/svg" width="830" height="340" viewBox="0 0 830 340">
  <style>
    .c{font:700 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff}
    .r{font:500 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
    .p{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
    .d{font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
    .e{animation:f .6s ease both}
    .e2{animation-delay:.15s}.e3{animation-delay:.3s}
    @keyframes f{from{opacity:0;transform:translateX(-8px)}}
  </style>
  <rect x="0.5" y="0.5" width="829" height="339" rx="12" fill="#161b22" stroke="#30363d"/>
  <line x1="40" y1="42" x2="40" y2="262" stroke="#30363d" stroke-width="2"/>

  <g class="e">
    <circle cx="40" cy="42" r="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text class="c" x="68" y="48">FOeng Group</text>
    <text class="r" x="176" y="48">Estagiário</text>
    <text class="p" x="800" y="48" text-anchor="end">abr. 2026 – presente</text>
    <text class="d" x="68" y="74">Desenvolvimento e manutenção da aplicação Flutter usada em campo, integrada com a base de dados</text>
    <text class="d" x="68" y="94">central. Aplicações internas integradas ao painel da empresa e orientação de 3 estagiários.</text>
  </g>

  <g class="e e2">
    <circle cx="40" cy="152" r="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text class="c" x="68" y="158">Softi9</text>
    <text class="r" x="126" y="158">Estagiário de verão</text>
    <text class="p" x="800" y="158" text-anchor="end">jun. – jul. 2025</text>
    <text class="d" x="68" y="184">Programação e sistemas e redes, com configuração de servidores Proxmox. Desenvolvimento do</text>
    <text class="d" x="68" y="204">Gestor Nebula VPN a pedido do coordenador do estágio.</text>
  </g>

  <g class="e e3">
    <circle cx="40" cy="262" r="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text class="c" x="68" y="268">EET Portugal</text>
    <text class="r" x="178" y="268">Estagiário de verão</text>
    <text class="p" x="800" y="268" text-anchor="end">jun. – jul. 2024</text>
    <text class="d" x="68" y="294">Protótipos de reconhecimento facial e visão computacional em C# e Python, e comunicação em</text>
    <text class="d" x="68" y="314">rede via sockets.</text>
  </g>
</svg>
